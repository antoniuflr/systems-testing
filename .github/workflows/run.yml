name: Unit Tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run unit tests
        working-directory: laboratories/cicd-documentation
        run: python -m unittest -v
